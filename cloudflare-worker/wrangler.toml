# ============================================================
# wrangler.toml - إعدادات مشروع Cloudflare Worker
# Smart Shopping Backend
# ============================================================

name = "smart-shopping-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

workers_dev = true

# ── توجيه النطاقات الفرعية للمتاجر المتعددة (Wildcard Storefront Routing) ──
# النطاق الرئيسي (smartshopping.click) و www يُداران مباشرة عبر Cloudflare Pages Custom Domain
routes = [
  { pattern = "*.smartshopping.click/*", zone_name = "smartshopping.click" }
]

# ── وضع المتغيرات الحساسة (Secrets) ──
# لا تُضَف هنا مباشرةً — استخدم الأمر التالي:
#   wrangler secret put ADMIN_SECRET_KEY
# المتغيرات السرية المطلوبة:
#   ADMIN_SECRET_KEY  → مفتاح التوقيع لتوليد JWT/tokens (عشوائي قوي)
# المتغيرات غير الحساسة (يمكن وضعها هنا):

[vars]
ENVIRONMENT        = "production"
# حماية Fail-closed: منع أي وضع إعداد أولي في الإنتاج.
# المصداقية تُدار حصرياً عبر Worker Secret ADMIN_PASSWORD_HASH.
ADMIN_ALLOW_SETUP  = "false"
# الأصول المسموح لها بالوصول للـ API (CORS Whitelist)
# افصل بين النطاقات بفاصلة
ALLOWED_ORIGINS    = "https://smartshopping.click,https://www.smartshopping.click,https://smartshopping-76x.pages.dev"
# مدة صلاحية جلسة الأدمن (بالساعات)
SESSION_TTL_HOURS  = "24"
# الحد الأقصى لطلبات الأدمن في الدقيقة (Rate Limiting)
RATE_LIMIT_ADMIN   = "60"
# منطقة التوقيت لتنسيق التواريخ
TIMEZONE           = "Africa/Algiers"

# ── قاعدة بيانات D1 ──
[[d1_databases]]
binding  = "DB"          # الاسم الذي سيُستخدَم في الكود: env.DB
database_name = "smart-shopping-db"
# أنشئ قاعدة البيانات أولاً بالأمر:
#   wrangler d1 create smart-shopping-db
# ثم انسخ الـ database_id الظاهر وضعه هنا:
database_id  = "05ec74cc-1259-48c1-a843-54fd5f7791dd"

# ── KV Namespace للـ Cache ──
[[kv_namespaces]]
binding    = "CACHE"
id         = "0276a15a76924b70a28c96304c182d3d"
# للبيئة المحلية (dev):
preview_id = "0276a15a76924b70a28c96304c182d3d"

# ── إعدادات التطوير المحلي ──
[dev]
port = 8787
local_protocol = "http"

# ── إعدادات البيئة التجريبية (Staging) ──
[env.staging]
name = "smart-shopping-api-staging"
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "https://smartshopping.click,https://www.smartshopping.click,https://smartshopping-76x.pages.dev,http://127.0.0.1:8787", SESSION_TTL_HOURS = "24", RATE_LIMIT_ADMIN = "60", TIMEZONE = "Africa/Algiers", ADMIN_ALLOW_SETUP = "false" }

[[env.staging.d1_databases]]
binding       = "DB"
database_name = "smart-shopping-db-staging"
database_id   = "09d7b9df-bc13-4e03-b607-33d47a3048f2"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "d96fdcdf549b40fab46e974c0aff6e53"

# ── R2 Bucket مخصص للـ Staging (معزول تماماً عن الإنتاج) ──
[[env.staging.r2_buckets]]
binding     = "MEDIA"
bucket_name = "smart-shopping-media-staging"

# ── R2 Bucket للإنتاج ──
[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "smart-shopping-media"
