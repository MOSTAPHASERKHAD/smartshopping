<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Shopping</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="assets/css/product.css">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">SMART <span>Shopping</span></a>
    <div class="header-actions">
      <a href="index.html" class="icon-btn" title="الرئيسية">🏠</a>
    </div>
  </div>
</header>

<main class="pd-page">
  <div class="pd-container">
    <a href="index.html" class="back-link">← العودة للمنتجات</a>
    <div id="pdLoading" class="loading">جاري تحميل المنتج...</div>
    <div id="pdContent" style="display:none">
      <div class="pd-layout">
        <div class="pd-left">
          <div class="pd-main-img" id="pdMainImage"></div>
          <div class="pd-thumbs" id="pdThumbs"></div>
          <div class="pd-features" id="pdFeatures"></div>
        </div>
        <div class="pd-info">
          <h2 id="pdTitle"></h2>
          <div class="pd-price" id="pdPrice"></div>
          <div class="pd-desc" id="pdDesc"></div>
          <div id="pdVariantSection" class="pd-variant" style="display:none"></div>
          <div class="pd-form-title">معلومات الطلب</div>
          <form id="pdForm" onsubmit="submitOrder(event)">
            <input type="hidden" id="pdProductId">
            <div class="pd-row">
              <div class="pd-group">
                <label>الاسم الكامل</label>
                <input type="text" id="pdName" required>
              </div>
              <div class="pd-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="pdPhone" placeholder="0555 XX XX XX" required>
              </div>
            </div>
            <div class="pd-row">
              <div class="pd-group">
                <label>الولاية</label>
                <select id="pdWilaya" required>
                  <option value="">اختر الولاية</option>
                </select>
              </div>
              <div class="pd-group">
                <label>البلدية</label>
                <input type="text" id="pdMunicipality" required placeholder="بلدية...">
              </div>
            </div>
            <div class="pd-row">
              <div class="pd-group">
                <label>نوع التوصيل</label>
                <select id="pdDelivery" required>
                  <option value="home">المنزل</option>
                  <option value="office">المكتب</option>
                </select>
              </div>
            </div>
            <div class="pd-group">
              <label>العنوان (الحي، الشارع، رقم المبنى)</label>
              <input type="text" id="pdAddress" placeholder="مثال: حي السلام، شارع 5، رقم 12" required>
            </div>
            <div class="pd-group">
              <label>ملاحظة (اختياري)</label>
              <textarea id="pdNote" rows="2" placeholder="..."></textarea>
            </div>
            <div class="pd-note">
              <span>⚠️</span>
              <span>سعر التوصيل يتم تأكيده بعد التواصل معك.</span>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="pdSubmit">تأكيد الطلب</button>
            <a href="#" onclick="orderViaWhatsApp(event)" class="btn btn-block btn-lg" style="margin-top:10px; background:#25d366; color:#fff; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px;">
              <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 0C5.405 0 .022 5.372.022 11.99c0 2.115.553 4.183 1.605 6L.004 24l6.155-1.609a11.96 11.96 0 0 0 5.872 1.53h.005c6.626 0 12.008-5.372 12.008-11.99A11.986 11.986 0 0 0 12.031 0z"/></svg>
              <span style="font-weight:700">الطلب السريع عبر واتساب</span>
            </a>
          </form>
          <div id="pdSuccess" class="pd-success" style="display:none"></div>
        </div>
      </div>
      <div class="reviews-section" id="reviewsSection">
        <h3>التقييمات</h3>
        <div id="reviewsList"></div>
        <div class="review-form">
          <h4>اكتب تقييمك</h4>
          <div class="review-rating" id="reviewRating">
            <button onclick="setReviewRating(1)">★</button>
            <button onclick="setReviewRating(2)">★</button>
            <button onclick="setReviewRating(3)">★</button>
            <button onclick="setReviewRating(4)">★</button>
            <button onclick="setReviewRating(5)">★</button>
          </div>
          <textarea id="reviewText" placeholder="اكتب رأيك في المنتج..."></textarea>
          <div class="form-row">
            <input type="text" id="reviewName" placeholder="اسمك">
            <input type="text" id="reviewLocation" placeholder="المدينة">
          </div>
          <button class="btn btn-primary" style="margin-top:10px" onclick="submitReview()">إرسال التقييم</button>
        </div>
      </div>
      <div class="suggested-section" id="suggestedSection" style="display:none">
        <h2>منتجات مقترحة</h2>
        <div id="suggestedGrid" class="products-grid"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 Smart Shopping — جميع الحقوق محفوظة</p>
</footer>

<script>
function esc(s) {
  if (typeof s !== 'string' && typeof s !== 'number') s = String(s || '');
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ea(s) { return esc(s).replace(/&#39;/g,"'").replace(/&quot;/g,'"'); }
function showToast(msg,type){var e=document.querySelector('.toast');if(e)e.remove();var el=document.createElement('div');el.className='toast toast-'+(type||'info');el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove()},3000);}
var API_URL = 'https://script.google.com/macros/s/AKfycbxtnGWw22qtTHyC6xXXRWrjvydZBnMeanCRqOnytSYWC0VLF1zVG8Uq8FF2-mPHhpOZOQ/exec';
var CUSTOMER_KEY = 'sk_customer';
var currentProduct = null;
var pdVariantSize = null;
var pdVariantColor = null;
var reviewRating = 0;

var WILAYAS = [
  {code:'01',ar:'أدران',en:'Adrar'},{code:'02',ar:'الشلف',en:'Chlef'},{code:'03',ar:'الأغواط',en:'Laghouat'},
  {code:'04',ar:'أم البواقي',en:'Oum El Bouaghi'},{code:'05',ar:'باتنة',en:'Batna'},{code:'06',ar:'بجاية',en:'Bejaia'},
  {code:'07',ar:'بسكرة',en:'Biskra'},{code:'08',ar:'بشار',en:'Bechar'},{code:'09',ar:'البليدة',en:'Blida'},
  {code:'10',ar:'البويرة',en:'Bouira'},{code:'11',ar:'تمنراست',en:'Tamanrasset'},{code:'12',ar:'تبسة',en:'Tebessa'},
  {code:'13',ar:'تلمسان',en:'Tlemcen'},{code:'14',ar:'تيارت',en:'Tiaret'},{code:'15',ar:'تيزي وزو',en:'Tizi Ouzou'},
  {code:'16',ar:'الجزائر',en:'Alger'},{code:'17',ar:'الجلفة',en:'Djelfa'},{code:'18',ar:'جيجل',en:'Jijel'},
  {code:'19',ar:'سطيف',en:'Setif'},{code:'20',ar:'سعيدة',en:'Saida'},{code:'21',ar:'سكيكدة',en:'Skikda'},
  {code:'22',ar:'سيدي بلعباس',en:'Sidi Bel Abbes'},{code:'23',ar:'عنابة',en:'Annaba'},{code:'24',ar:'قالمة',en:'Guelma'},
  {code:'25',ar:'قسنطينة',en:'Constantine'},{code:'26',ar:'المدية',en:'Medea'},{code:'27',ar:'مستغانم',en:'Mostaganem'},
  {code:'28',ar:'المسيلة',en:'M\'sila'},{code:'29',ar:'معسكر',en:'Mascara'},{code:'30',ar:'ورقلة',en:'Ouargla'},
  {code:'31',ar:'وهران',en:'Oran'},{code:'32',ar:'البيض',en:'El Bayadh'},{code:'33',ar:'إليزي',en:'Illizi'},
  {code:'34',ar:'برج بوعريريج',en:'Bordj Bou Arreridj'},{code:'35',ar:'بومرداس',en:'Boumerdes'},{code:'36',ar:'الطارف',en:'El Tarf'},
  {code:'37',ar:'تندوف',en:'Tindouf'},{code:'38',ar:'تيسمسيلت',en:'Tissemsilt'},{code:'39',ar:'الوادي',en:'El Oued'},
  {code:'40',ar:'خنشلة',en:'Khenchela'},{code:'41',ar:'سوق أهراس',en:'Souk Ahras'},{code:'42',ar:'تيبازة',en:'Tipaza'},
  {code:'43',ar:'ميلة',en:'Mila'},{code:'44',ar:'عين الدفلى',en:'Ain Defla'},{code:'45',ar:'النعامة',en:'Naama'},
  {code:'46',ar:'عين تموشنت',en:'Ain Temouchent'},{code:'47',ar:'غرداية',en:'Ghardaia'},{code:'48',ar:'غليزان',en:'Relizane'},
  {code:'49',ar:'تيميمون',en:'Timimoun'},{code:'50',ar:'برج باجي مختار',en:'Bordj Badji Mokhtar'},
  {code:'51',ar:'أولاد جلال',en:'Ouled Djellal'},{code:'52',ar:'بني عباس',en:'Beni Abbes'},
  {code:'53',ar:'عين صالح',en:'In Salah'},{code:'54',ar:'عين قزام',en:'In Guezzam'},
  {code:'55',ar:'توقرت',en:'Touggourt'},{code:'56',ar:'جانت',en:'Djanet'},{code:'57',ar:'المغير',en:'El M\'Ghair'},
  {code:'58',ar:'المنيعة',en:'El Meniaa'}
];

function apiCall(action, params, callback) {
  var url = API_URL + '?action=' + action;
  if (params) { for (var k in params) { url += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); } }
  fetch(url).then(function(r) { return r.json(); }).then(function(d) { callback(d); }).catch(function() { callback({ error: 'Network error' }); });
}

function populateWilaya() {
  var s = document.getElementById('pdWilaya');
  WILAYAS.forEach(function(w) {
    var o = document.createElement('option');
    o.value = w.code;
    o.textContent = w.code + ' - ' + w.ar;
    s.appendChild(o);
  });
}

function loadProduct() {
  var params = new URLSearchParams(window.location.search);
  var pid = params.get('id');
  if (!pid) { window.location.href = 'index.html'; return; }
  apiCall('catalog', {}, function(d) {
    if (!d || d.error || !d.products) { document.getElementById('pdLoading').textContent = 'خطأ في تحميل المنتج'; return; }
    var p = d.products.find(function(x) { return x.id === pid; });
    if (!p) { document.getElementById('pdLoading').textContent = 'المنتج غير موجود'; return; }
    currentProduct = p;
    document.title = (p.title_ar || p.title_en) + ' - Smart Shopping';
    renderProduct(p);
    loadReviews(pid);
    renderSuggested(pid, d.products);
  });
}

function renderProduct(p) {
  document.getElementById('pdLoading').style.display = 'none';
  document.getElementById('pdContent').style.display = 'block';
  document.getElementById('pdProductId').value = p.id;
  document.getElementById('pdTitle').textContent = p.title_ar || p.title_en || '';
  var ph = '<span>' + Number(p.price).toLocaleString() + ' د.ج</span>';
  if (p.old_price > 0) ph += ' <span class="pd-old">' + Number(p.old_price).toLocaleString() + ' د.ج</span>';
  document.getElementById('pdPrice').innerHTML = ph;
  document.getElementById('pdDesc').textContent = p.desc_ar || p.desc_en || '';

  var imgs = [p.image1, p.image2, p.image3, p.image4, p.image5, p.image6].filter(function(i) {
    return i && typeof i === 'string' && (i.trim().startsWith('http') || i.trim().startsWith('data:'));
  });
  var mainEl = document.getElementById('pdMainImage');
  if (imgs.length > 0) {
    mainEl.innerHTML = '<img id="pdMainImg" src="' + esc(imgs[0]) + '" alt="" style="width:100%;height:100%;object-fit:cover">';
    window._pdImgs = imgs; window._pdImgIdx = 0;
    if (imgs.length > 1) {
      var th = '';
      for (var i = 0; i < imgs.length; i++) {
        th += '<div class="pd-thumb' + (i === 0 ? ' active' : '') + '" onclick="selectImg(' + i + ')"><img src="' + esc(imgs[i]) + '" alt=""></div>';
      }
      document.getElementById('pdThumbs').innerHTML = th;
    }
  }

  renderFeatures(p);
  renderVariantSection(p);

  var saved = JSON.parse(localStorage.getItem(CUSTOMER_KEY) || '{}');
  document.getElementById('pdName').value = saved.name || '';
  document.getElementById('pdPhone').value = saved.phone || '';
  document.getElementById('pdAddress').value = saved.address || '';
  populateWilaya();
}

function selectImg(idx) {
  var imgs = window._pdImgs;
  if (!imgs || !imgs[idx]) return;
  window._pdImgIdx = idx;
  document.getElementById('pdMainImg').src = imgs[idx];
  document.querySelectorAll('.pd-thumb').forEach(function(t, i) { t.classList.toggle('active', i === idx); });
}

function renderFeatures(p) {
  var el = document.getElementById('pdFeatures');
  if (!el) return;
  var feats = [
    { icon: '💰', text: 'الدفع عند الاستلام' },
    { icon: '🚚', text: 'توصيل لجميع الولايات' },
    { icon: '✅', text: 'منتج أصلي 100%' }
  ];
  if (p.old_price > 0 && p.price < p.old_price) {
    var pct = Math.round((1 - p.price / p.old_price) * 100);
    feats.push({ icon: '🔥', text: 'خصم ' + pct + '%' });
  }
  el.innerHTML = '<h4>المميزات</h4><div class="pd-feature-list">' +
    feats.map(function(f) { return '<div class="pd-feature-item"><span class="pd-feat-icon">' + f.icon + '</span><span>' + f.text + '</span></div>'; }).join('') + '</div>';
}

function renderVariantSection(p) {
  var el = document.getElementById('pdVariantSection');
  if (!el) return;
  var html = '';
  if (p.size) {
    var sizes = p.size.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
    if (sizes.length) {
      html += '<h4>المقاسات</h4><div class="size-options">';
      sizes.forEach(function(s) { html += '<button type="button" class="size-btn" onclick="selectSize(this,\'' + s + '\')">' + s + '</button>'; });
      html += '</div>';
    }
  }
  if (p.color) {
    var colors = p.color.split(',').map(function(c) { return c.trim(); }).filter(Boolean);
    if (colors.length) {
      html += '<h4>الألوان</h4><div class="color-options">';
      colors.forEach(function(c) { html += '<button type="button" class="color-swatch" style="background:' + c + '" onclick="selectColor(this,\'' + c + '\')" title="' + c + '"></button>'; });
      html += '</div>';
    }
  }
  if (html) { el.innerHTML = html; el.style.display = 'block'; } else { el.style.display = 'none'; }
}

function selectSize(btn, size) {
  document.querySelectorAll('.size-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  pdVariantSize = size;
}
function selectColor(btn, color) {
  document.querySelectorAll('.color-swatch').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  pdVariantColor = color;
}

function submitOrder(e) {
  e.preventDefault();
  var n = document.getElementById('pdName').value.trim();
  var ph = document.getElementById('pdPhone').value.trim();
  var w = document.getElementById('pdWilaya').value;
  var m = document.getElementById('pdMunicipality').value.trim();
  var d = document.getElementById('pdDelivery').value;
  var addr = document.getElementById('pdAddress').value.trim();
  var note = (document.getElementById('pdNote').value.trim()) + ' | ' + addr;
  if (!n || !ph || !w || !m || !addr) return;
  var pid = document.getElementById('pdProductId').value;
  var p = currentProduct;
  if (!p) return;
  var finalPrice = p.price;
  if (pdVariantSize || pdVariantColor) {
    finalPrice = p.price;
  }
  var minOrd = 0;
  if (minOrd > 0 && finalPrice < minOrd) {
    showToast('الحد الأدنى للطلب هو ' + minOrd.toLocaleString() + ' دج', 'error');
    document.getElementById('pdSubmit').disabled = false;
    return;
  }
  var wil = WILAYAS.find(function(x) { return x.code === w; });
  localStorage.setItem(CUSTOMER_KEY, JSON.stringify({ name: n, phone: ph, address: addr }));
  var variantNote = '';
  if (pdVariantSize) variantNote += ' | المقاس: ' + pdVariantSize;
  if (pdVariantColor) variantNote += ' | اللون: ' + pdVariantColor;
  var items = JSON.stringify([{ id: pid, title: p.title_ar || p.title_en, price: finalPrice, qty: 1, size: pdVariantSize || '', color: pdVariantColor || '', sku: '' }]);
  document.getElementById('pdSubmit').disabled = true;
  apiCall('order', {
    name: n, phone: ph, wilaya_code: w, wilaya_ar: wil ? wil.ar : '', wilaya_en: wil ? wil.en : '',
    municipality: m, delivery_type: d === 'office' ? 'Office' : 'Home', items_json: items, subtotal: finalPrice, note: note + variantNote
  }, function(data) {
    document.getElementById('pdSubmit').disabled = false;
    if (!data || data.error || !data.ok) { showToast('خطأ: ' + (data ? data.error || 'خطأ غير معروف' : 'خطأ في الشبكة'), 'error'); return; }
    document.getElementById('pdForm').style.display = 'none';
    var sc = document.getElementById('pdSuccess');
    sc.style.display = 'block';
    var orderId = data.order_id;
    var wa = storeSettings.phone || '213557543177';
    var msg = encodeURIComponent('مرحبا، أريد طلب رقم ' + orderId);
    sc.innerHTML = '<div class="pd-check">✓</div><h3>تم الطلب بنجاح!</h3><p style="color:var(--text2);font-size:.8rem">رقم الطلب:</p><div class="pd-id">' + orderId + '</div>' + (variantNote ? '<p style="color:var(--text2);font-size:.75rem;margin-top:4px">' + variantNote + '</p>' : '') + '<p style="color:var(--text2);font-size:.75rem;margin-top:4px">سعر التوصيل يتم تأكيده بعد التواصل معك.</p><a href="https://wa.me/' + wa + '?text=' + msg + '" target="_blank" class="wa-btn">واتساب</a><br><a href="index.html" class="btn" style="margin-top:12px;border:1px solid var(--border)">← العودة للمنتجات</a>';
  });
}

function orderViaWhatsApp(e) {
  e.preventDefault();
  var p = currentProduct;
  if (!p) return;
  var wa = storeSettings.phone || '213557543177';
  var msg = encodeURIComponent('مرحبا، أريد طلب: ' + (p.title_ar || p.title_en) + ' بسعر ' + p.price + ' دج');
  window.open('https://wa.me/' + wa + '?text=' + msg, '_blank');
}

function setReviewRating(r) {
  reviewRating = r;
  document.querySelectorAll('#reviewRating button').forEach(function(b, i) { b.classList.toggle('active', i < r); });
}
function submitReview() {
  var text = document.getElementById('reviewText').value.trim();
  var name = document.getElementById('reviewName').value.trim() || 'عميل';
  if (!text || !reviewRating) { alert('اكتب تقييمك'); return; }
  apiCall('add_review', { product_id: currentProduct.id, rating: reviewRating, text: text, name: name, location: document.getElementById('reviewLocation').value.trim() }, function(d) {
    if (d && d.ok) {
      document.getElementById('reviewText').value = '';
      setReviewRating(0);
      loadReviews(currentProduct.id);
    } else {
      alert('حدث خطأ');
    }
  });
}
function loadReviews(pid) {
  apiCall('get_reviews', { product_id: pid }, function(d) {
    var el = document.getElementById('reviewsList');
    if (!d || !d.reviews || !d.reviews.length) { el.innerHTML = '<p style="color:var(--text2);font-size:.82rem">لا توجد تقييمات بعد</p>'; return; }
    el.innerHTML = d.reviews.map(function(r) {
      return '<div class="review-card"><div class="review-stars">' + '★'.repeat(r.rating) + '</div><div class="review-text">' + esc(r.text) + '</div><div class="review-author">' + esc(r.name || 'عميل') + (r.location ? ' — ' + esc(r.location) : '') + '</div></div>';
    }).join('');
  });
}

function renderSuggested(pid, all) {
  var others = all.filter(function(p) { return p.id !== pid; });
  if (!others.length) return;
  others.sort(function() { return Math.random() - 0.5; });
  var picked = others.slice(0, 4);
  var grid = document.getElementById('suggestedGrid');
  grid.innerHTML = picked.map(function(p) {
    var img = esc(p.image1 || '');
    return '<div class="product-card" onclick="window.location.href=\'product.html?id=' + esc(p.id) + '\'"><div class="product-image-wrap"><img class="product-image" src="' + img + '" loading="lazy" alt="' + esc(p.title_ar || p.title_en || '') + '"></div><div class="product-body"><div class="product-title">' + esc(p.title_ar || p.title_en || '') + '</div><div class="product-price"><span class="price-current">' + Number(p.price).toLocaleString() + ' د.ج</span></div></div></div>';
  }).join('');
  document.getElementById('suggestedSection').style.display = 'block';
}

var storeSettings = {};
apiCall('settings', {}, function(d) {
  if (d && !d.error) storeSettings = d;
});

loadProduct();
</script>
</body>
</html>
